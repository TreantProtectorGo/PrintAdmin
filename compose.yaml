services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PRINTADMIN_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/printadmin
      DB_USERNAME: printadmin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-printadmin-local}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: printadmin
      POSTGRES_USER: printadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printadmin-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
