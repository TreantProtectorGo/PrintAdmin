name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: H2
            arguments: ''
          - database: PostgreSQL
            arguments: '-Dspring.profiles.include=postgres-test'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        env:
          MAVEN_TEST_ARGUMENTS: ${{ matrix.arguments }}
        run: ./mvnw --batch-mode --no-transfer-progress verify $MAVEN_TEST_ARGUMENTS

  docker:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: printadmin-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start application and PostgreSQL
        run: docker compose up --build -d --wait
      - name: Verify API and persistence
        run: python3 scripts/docker-smoke.py
      - name: Run the demo twice
        run: |
          python3 scripts/demo.py
          python3 scripts/demo.py
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove test containers and volume
        if: always()
        run: docker compose down --volumes
