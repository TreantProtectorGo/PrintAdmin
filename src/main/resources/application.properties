spring.application.name=printadmin

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printadmin}
spring.datasource.username=${DB_USERNAME:${USER}}
spring.datasource.password=${DB_PASSWORD:}
# Convenient for local learning; use migrations for a production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

printadmin.quota-zone=Asia/Hong_Kong

springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.override-with-generic-response=false
